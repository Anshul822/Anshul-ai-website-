<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>मेरा AI चैट बॉट</title>
<style>
  body { font-family: Arial; background: #f0f0f0; margin: 0; padding: 0; }
  #chat-container { max-width: 500px; margin: 30px auto; background: white; border-radius: 10px; padding: 20px; }
  #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
  .user-msg { text-align: right; color: blue; margin: 5px; }
  .bot-msg { text-align: left; color: green; margin: 5px; }
  #userInput { width: 75%; padding: 10px; }
  button { padding: 10px; }
</style>
</head>
<body>
<div id="chat-container">
  <h2>मेरा AI चैट बॉट</h2>
  <div id="messages"></div>
  <input type="text" id="userInput" placeholder="अपना सवाल लिखें...">
  <button onclick="sendMessage()">भेजें</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value;
  if (!text) return;
  addMessage(text, 'user-msg');
  input.value = '';
  const reply = await getAIResponse(text);
  addMessage(reply, 'bot-msg');
}

function addMessage(text, className) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = className;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function getAIResponse(userText) {
  return "आपने पूछा: " + userText;
}
</script>
</body>
</html>
